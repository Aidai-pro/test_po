<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — HorseTours</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #1e293b; text-align: center; margin-bottom: 20px; }
        form p { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #475569; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1rem; }
        .helptext { display: none; }
        .errorlist { color: #dc2626; list-style: none; margin-bottom: 10px; font-size: 0.9rem; font-weight: 600; }
        .btn-submit { width: 100%; padding: 14px; background: #ff9800; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .links { text-align: center; margin-top: 20px; font-size: 0.95rem; }
        .links a { color: #2e7d32; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📝 Регистрация</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Создать аккаунт</button>
        </form>
        <div class="links">
            Уже есть аккаунт? <a href="{% url 'horse_tours:login' %}">Войти</a><br><br>
            <a href="{% url 'horse_tours:tour_list' %}">← На главную</a>
        </div>
    </div>
</body>
</html>
