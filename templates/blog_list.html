{% extends 'blog/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center mb-4">Список публикаций</h1>

    <!-- Карточки с тремя статьями -->
    <div class="row">
        {% for post in posts %}
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{ post.title }}</h5>
                        <p class="card-text text-muted flex-grow-1">{{ post.content|truncatewords:20 }}</p>
                        <a href="{% url 'blog:detail' post.pk %}" class="btn btn-primary mt-auto">Читать далее &rarr;</a>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="col-12">
                <div class="alert alert-info text-center">Публикаций пока нет.</div>
            </div>
        {% endfor %}
    </div>

    <!-- Зеленая кнопка скачать отчет Word прямо под статьями -->
    <div class="text-center mt-4 mb-5">
        <a href="{% url 'articles:export_report' %}" class="btn btn-success btn-lg shadow">
            📄 Скачать отчет Word
        </a>
    </div>
</div>
{% endblock %}
