{% extends 'blog/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>{% if object %}Редактирование статьи{% else %}Создание новой статьи{% endif %}</h2>
    <form method="post" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="{% url 'articles:list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
