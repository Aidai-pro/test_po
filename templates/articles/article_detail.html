{% extends 'blog/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-body">
            <h2 class="card-title">{{ object.title }}</h2>
            <p class="text-muted"><small>Опубликовано: {{ object.created_at|date:"d.m.Y H:i" }}</small></p>
            <hr>
            <p class="card-text">{{ object.content|linebreaks }}</p>
            <hr>
            <a href="{% url 'articles:list' %}" class="btn btn-secondary">Назад к списку</a>
            <a href="{% url 'articles:update' object.pk %}" class="btn btn-warning">Редактировать</a>
            <a href="{% url 'articles:delete' object.pk %}" class="btn btn-danger">Удалить</a>
        </div>
    </div>
</div>
{% endblock %}
